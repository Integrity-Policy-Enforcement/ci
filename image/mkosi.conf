# SPDX-License-Identifier: GPL-2.0-only

[Distribution]
Distribution=fedora
Release=43

[Output]
Format=disk
OutputDirectory=output
ImageId=ipe-tests

[Build]
CacheDirectory=%D/../build/mkosi-cache

[Content]
Bootable=yes
Bootloader=uki
KernelModulesInitrd=no
Packages=
        systemd
        systemd-udev
        systemd-boot-unsigned
        coreutils
        device-mapper
        keyutils
        kmod
        veritysetup
        fsverity-utils
        util-linux
        python3

ExtraTrees=%D/systemd:/usr/lib/systemd/system
           %D/systemd-preset/95-ipe-tests.preset:/usr/lib/systemd/system-preset/95-ipe-tests.preset
           %D/../build/kernel-install:/

KernelCommandLine=root=dissect
                  systemd.verity=no
                  systemd.image_policy=root=signed:esp=unused:=absent
                  systemd.firstboot=no
                  systemd.volatile=state
                  systemd.default_device_timeout_sec=600

RootPassword=hashed:

[Validation]
Verity=signed
VerityKey=%D/../build/keys/builtin-key.pem
VerityCertificate=%D/../build/keys/builtin-cert.pem
SecureBoot=yes
SecureBootKey=%D/../build/keys/secureboot-key.pem
SecureBootCertificate=%D/../build/keys/secureboot-cert.pem
SignExpectedPcr=no

[Runtime]
Firmware=uefi-secure-boot
FirmwareVariables=custom
RAM=2G
CPUs=2
KVM=auto
TPM=no
VSock=no

KernelCommandLineExtra=loglevel=7
