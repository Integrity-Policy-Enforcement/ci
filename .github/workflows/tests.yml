# SPDX-License-Identifier: GPL-2.0-only

name: tests
run-name: >-
  ${{ inputs.lore_message_id
      && format('tests: {0} <{1}>', inputs.series_subject || 'lore series', inputs.lore_message_id)
      || '' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Test the latest upstream and IPE trees once a day (UTC).
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: Branch in Integrity-Policy-Enforcement/linux; empty uses the daily IPE rebase
        required: false
        type: string
      lore_message_id:
        description: lore.kernel.org Message-ID or URL of a patch series to apply with b4 before testing
        required: false
        type: string
      use_base_commit:
        description: Apply the lore series on its declared base-commit when the tree has it
        required: false
        type: boolean
        default: false
      series_subject:
        description: Subject of the lore series, shown in the run name
        required: false
        type: string
      architectures:
        description: Architectures to test
        required: false
        type: choice
        options: [all, x86_64]
        default: all
      report_issue:
        description: Issue number that receives the result as a comment
        required: false
        type: string

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - id: select
        env:
          ARCHITECTURES: ${{ inputs.architectures || 'all' }}
        run: |
          set -euo pipefail
          # The arm64 runner has no KVM, so its VM runs under TCG. Use the full
          # 360-minute GitHub-hosted job limit; run-vm.py stops TCG VMs after
          # 300 minutes, leaving time for setup, build and evidence upload.
          all='[
            {"architecture": "x86_64", "runner": "ubuntu-26.04", "job-timeout-minutes": 180},
            {"architecture": "arm64", "runner": "ubuntu-26.04-arm", "job-timeout-minutes": 360}
          ]'
          if [[ "$ARCHITECTURES" == all ]]; then
              selected=$all
          else
              selected=$(jq --arg arch "$ARCHITECTURES" '[.[] | select(.architecture == $arch)]' <<<"$all")
          fi
          echo "include=$(jq -c . <<<"$selected")" >>"$GITHUB_OUTPUT"

  test:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.job-timeout-minutes }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare kernel tree
        env:
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          set -euo pipefail
          if [[ -n "$KERNEL_BRANCH" ]]; then
              git check-ref-format --branch "$KERNEL_BRANCH" >/dev/null
              git clone --filter=blob:none --single-branch --branch "$KERNEL_BRANCH" \
                  https://github.com/Integrity-Policy-Enforcement/linux.git \
                  kernel-source
              printf 'kernel branch: %s\nkernel SHA:    %s\n' \
                  "$KERNEL_BRANCH" "$(git -C kernel-source rev-parse HEAD)"
          else
              git clone --filter=blob:none --single-branch --branch master \
                  https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git \
                  kernel-source
              git -C kernel-source remote add ipe \
                  https://git.kernel.org/pub/scm/linux/kernel/git/wufan/ipe.git
              git -C kernel-source fetch --filter=blob:none ipe next
              git -C kernel-source switch --create ipe-next-tested FETCH_HEAD

              upstream_sha=$(git -C kernel-source rev-parse origin/master)
              ipe_sha=$(git -C kernel-source rev-parse HEAD)
              git -C kernel-source \
                  -c user.name='IPE CI' \
                  -c user.email='ipe-ci@localhost' \
                  rebase origin/master

              printf 'upstream master: %s\nipe next:        %s\n' \
                  "$upstream_sha" "$ipe_sha"
          fi

      - name: Install dependencies
        run: |
          # Use Ubuntu sources only, not repositories for runner-preinstalled tools.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_sources=(
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
              -o Dir::Etc::sourceparts=-
          )
          sudo apt-get "${apt_sources[@]}" update -qq
          cat config/host-packages.txt \
              "config/host-packages-${{ matrix.architecture }}.txt" \
              | xargs sudo apt-get "${apt_sources[@]}" install -y --no-install-recommends
          sudo python3 -m pip install --break-system-packages \
              "git+https://github.com/systemd/mkosi@$(cat config/mkosi.version)"

      - name: Apply patches from lore
        if: inputs.lore_message_id != ''
        env:
          LORE_MESSAGE_ID: ${{ inputs.lore_message_id }}
          USE_BASE_COMMIT: ${{ inputs.use_base_commit }}
          GIT_COMMITTER_NAME: IPE CI
          GIT_COMMITTER_EMAIL: ipe-ci@localhost
        run: |
          set -euo pipefail
          sudo python3 -m pip install --break-system-packages b4==0.16.0
          base_args=()
          if [[ "$USE_BASE_COMMIT" == true ]]; then
              base_args+=(--use-base-commit)
          fi
          python3 scripts/apply-lore-series.py "${base_args[@]}" \
              --status out/apply.json kernel-source "$LORE_MESSAGE_ID"

      - name: Install arm64 firmware
        if: matrix.architecture == 'arm64'
        run: sudo python3 scripts/install-firmware.py

      - name: Run tests
        run: ./run.py kernel-source out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-evidence-${{ matrix.architecture }}
          path: |
            out/apply.json
            out/console.log
            out/result.log
            out/host.json
            out/verdict.json
            build/kernel/.config
            build/kernel/build.log
            build/kernel/install.log
            build/kernel/merge.log
          retention-days: ${{ job.status == 'success' && 7 || 30 }}
          if-no-files-found: error

  report:
    needs: test
    if: always() && inputs.report_issue != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: test-evidence-*
          path: evidence

      - name: Report to the series issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT_ISSUE: ${{ inputs.report_issue }}
          LORE_MESSAGE_ID: ${{ inputs.lore_message_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/lore-report.py evidence
