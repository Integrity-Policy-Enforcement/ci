name: tests

on:
  push:
    branches: [main]
  schedule:
    # Test the latest upstream and IPE trees once a day (UTC).
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-26.04
          - architecture: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Prepare kernel tree
        run: |
          set -euo pipefail
          git clone --filter=blob:none --single-branch --branch master \
              https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git \
              kernel-source
          git -C kernel-source remote add ipe \
              https://git.kernel.org/pub/scm/linux/kernel/git/wufan/ipe.git
          git -C kernel-source fetch --filter=blob:none ipe next
          git -C kernel-source switch --create ipe-next-tested FETCH_HEAD

          upstream_sha=$(git -C kernel-source rev-parse origin/master)
          ipe_sha=$(git -C kernel-source rev-parse HEAD)
          git -C kernel-source rebase origin/master

          printf 'upstream master: %s\nipe next:        %s\n' \
              "$upstream_sha" "$ipe_sha"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          cat config/host-packages.txt \
              "config/host-packages-${{ matrix.architecture }}.txt" \
              | xargs sudo apt-get install -y --no-install-recommends
          sudo python3 -m pip install --break-system-packages \
              "git+https://github.com/systemd/mkosi@$(cat config/mkosi.version)"

      - name: Install arm64 firmware
        if: matrix.architecture == 'arm64'
        run: sudo python3 scripts/install-firmware.py

      - name: Run tests
        run: ./run.py kernel-source out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-evidence-${{ matrix.architecture }}
          path: |
            out/console.log
            out/result.log
            out/host.json
            out/verdict.json
            build/kernel/.config
            build/kernel/build.log
            build/kernel/install.log
            build/kernel/merge.log
          retention-days: ${{ job.status == 'success' && 7 || 30 }}
          if-no-files-found: error
